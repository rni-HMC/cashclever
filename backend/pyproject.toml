[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cashclever"
version = "0.1.0"
description = "Empty starter backend: FastAPI + spec-first OpenAPI + Postgres, one dummy endpoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "datamodel-code-generator>=0.26",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
